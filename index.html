<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy-Order food online</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <header class="navbar">
    <div class="logo">S <span>Swiggy</span></div>

    <nav>
        <a href="#">Swiggy Corporate</a>
        <a href="#">Partner with us</a>
        <a href="#app">Get the App ↗️</a>
        <button class="signin">Sign in</button>
    </nav>
    </header>
    <section class="hero">

    <div class="hero-content">

        <h1>
            Order food & groceries. Discover
            <br>
            best restaurants. Swiggy it!
        </h1>

        <div class="search-container">

            <div class="search-box">
                <span>📍</span>
                <input type="text"
                placeholder="Enter your delivery location">
            </div>

            <div class="search-box">
                <input type="text"
                placeholder="Search for restaurant, item or more">
                <span>🔍</span>
            </div>

        </div>
        <div class="services">

            <div class="service-card">
                <h2>FOOD DELIVERY</h2>
                <p>FROM RESTAURANTS</p>
                <small>UPTO 60% OFF</small>
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400"
                alt="Food">
                <span class="arrow">➜</span>
            </div>

            <div class="service-card">
                <h2>INSTAMART</h2>
                <p>INSTANT GROCERY</p>
                <small>UPTO 60% OFF</small>
                <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=400"
                alt="Groceries">
                <span class="arrow">➜</span>
            </div>

            <div class="service-card">
                <h2>DINEOUT</h2>
                <p>EAT OUT & SAVE MORE</p>
                <small>UPTO 50% OFF</small>
                <img src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=400"
                alt="Restaurant">
                <span class="arrow">➜</span>
            </div>

        </div>
    </div>
</section>
    
</body>
</html>
